[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kolo-create"
version = "0.22.0"
description = "Unified brand extraction and branded PDF/PowerPoint creation skill for Kolo"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "playwright>=1.50,<2",
  "pypdf>=5,<7",
  "reportlab>=4.2,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
kolo-create = "kolo_design.cli:main"
kolo-design = "kolo_design.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
